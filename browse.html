<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Engineering Design DB — Browse</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='5' r='3.5' fill='%23ff6b3d'/%3E%3Ccircle cx='4' cy='25' r='3.5' fill='%23ff6b3d'/%3E%3Ccircle cx='28' cy='25' r='3.5' fill='%23ff6b3d'/%3E%3Ccircle cx='16' cy='19' r='2.5' fill='%23ff9d7a'/%3E%3Cline x1='16' y1='5' x2='4' y2='25' stroke='%23ff6b3d' stroke-width='1.5' stroke-opacity='0.6'/%3E%3Cline x1='16' y1='5' x2='28' y2='25' stroke='%23ff6b3d' stroke-width='1.5' stroke-opacity='0.6'/%3E%3Cline x1='4' y1='25' x2='28' y2='25' stroke='%23ff6b3d' stroke-width='1.5' stroke-opacity='0.6'/%3E%3Cline x1='16' y1='5' x2='16' y2='19' stroke='%23ff9d7a' stroke-width='1' stroke-opacity='0.5'/%3E%3Cline x1='16' y1='19' x2='4' y2='25' stroke='%23ff9d7a' stroke-width='1' stroke-opacity='0.5'/%3E%3Cline x1='16' y1='19' x2='28' y2='25' stroke='%23ff9d7a' stroke-width='1' stroke-opacity='0.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0b;
  --surface: #131316;
  --surface-2: #1c1c20;
  --surface-3: #26262b;
  --border: rgba(255,255,255,0.07);
  --border-strong: rgba(255,255,255,0.12);
  --fg: #ececee;
  --fg-muted: #b6b6bf;
  --fg-faint: #8a8a93;
  --accent: #ff6b3d;
  --accent-soft: rgba(255,107,61,0.12);
  --success: #7ad3a6;
  --warn: #f0a85b;
  --radius-sm: 4px;
  --radius: 6px;
  --radius-lg: 10px;
  --font: "Geist", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
}

/* ── Topbar ─────────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(10,10,11,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 52px;
  display: flex; align-items: center; gap: 10px;
}
.topbar-logo {
  display: flex; align-items: center; gap: 7px;
  text-decoration: none; color: var(--fg);
  font-weight: 600; font-size: 14px; flex-shrink: 0;
}
.topbar-sep { color: var(--fg-faint); }
.topbar-section { color: var(--fg-muted); font-size: 13px; flex-shrink: 0; }
.search-wrap {
  flex: 1; max-width: 500px; margin: 0 8px; position: relative;
}
.search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--fg-faint); pointer-events: none;
}
#search-input {
  width: 100%; padding: 7px 36px 7px 32px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--fg);
  font-size: 13px; font-family: var(--font); outline: none;
  transition: border-color 120ms;
}
#search-input::placeholder { color: var(--fg-faint); }
#search-input:focus { border-color: var(--accent); }
.search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--fg-faint); cursor: pointer;
  padding: 2px; line-height: 1; display: none;
}
.search-clear.visible { display: block; }
.search-clear:hover { color: var(--fg); }
.view-toggle {
  display: flex; gap: 2px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 3px; flex-shrink: 0;
}
.view-btn {
  padding: 4px 10px; border-radius: var(--radius-sm);
  border: none; background: transparent; color: var(--fg-muted);
  cursor: pointer; font-size: 12px; font-family: var(--font);
  transition: all 100ms; display: flex; align-items: center; gap: 5px;
}
.view-btn.active { background: var(--surface-3); color: var(--fg); }
.view-btn:hover:not(.active) { color: var(--fg); }
.topbar-link {
  color: var(--fg-muted); text-decoration: none; font-size: 12px;
  flex-shrink: 0; display: flex; align-items: center; gap: 4px;
  transition: color 120ms; white-space: nowrap;
}
.topbar-link:hover { color: var(--accent); }

/* ── Layout ─────────────────────────────────────────────────────── */
.layout {
  display: flex;
  height: calc(100vh - 52px);
}

/* ── Sidebar ────────────────────────────────────────────────────── */
.sidebar {
  width: 216px; flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--border);
  overflow-y: auto; display: flex; flex-direction: column;
}
.filter-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.filter-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.filter-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--fg-faint);
}
.filter-clear {
  font-size: 10px; color: var(--accent); background: none; border: none;
  cursor: pointer; padding: 0; font-family: var(--font);
}
.filter-clear:hover { text-decoration: underline; }
.cat-list { display: flex; flex-direction: column; gap: 1px; }
.cat-item {
  display: flex; align-items: center; gap: 7px;
  padding: 4px 6px; border-radius: var(--radius-sm);
  cursor: pointer; transition: background 80ms; user-select: none;
}
.cat-item:hover { background: var(--surface-2); }
.cat-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.cat-checkbox { display: none; }
.cat-item-name { font-size: 12px; color: var(--fg-muted); flex: 1; line-height: 1.3; }
.cat-item.active .cat-item-name { color: var(--fg); font-weight: 500; }
.cat-count {
  font-size: 10px; color: var(--fg-faint);
  font-variant-numeric: tabular-nums;
}
.show-more-btn {
  margin-top: 4px; font-size: 11px; color: var(--accent);
  background: none; border: none; cursor: pointer;
  padding: 2px 6px; font-family: var(--font); text-align: left;
}
.show-more-btn:hover { text-decoration: underline; }
.year-row { display: flex; gap: 6px; align-items: center; }
.year-input {
  width: 64px; padding: 5px 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--fg);
  font-size: 12px; font-family: var(--font); outline: none;
}
.year-input:focus { border-color: var(--accent); }
.year-sep { color: var(--fg-faint); font-size: 11px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  padding: 3px 8px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 20px;
  font-size: 11px; color: var(--fg-muted); cursor: pointer;
  transition: all 100ms; user-select: none;
}
.chip:hover { border-color: var(--border-strong); color: var(--fg); }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.org-input {
  width: 100%; padding: 5px 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--fg);
  font-size: 12px; font-family: var(--font); outline: none;
}
.org-input::placeholder { color: var(--fg-faint); }
.org-input:focus { border-color: var(--accent); }
.sidebar-footer {
  margin-top: auto; padding: 12px 14px;
  border-top: 1px solid var(--border);
}
.clear-all-btn {
  width: 100%; padding: 7px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--fg-muted); font-size: 12px; font-family: var(--font);
  cursor: pointer; transition: all 120ms;
}
.clear-all-btn:hover { border-color: var(--border-strong); color: var(--fg); }

/* ── Main area ──────────────────────────────────────────────────── */
.main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.results-bar {
  position: sticky; top: 0; z-index: 10;
  background: rgba(10,10,11,0.9); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.results-count { font-size: 12px; color: var(--fg-muted); }
.results-count strong { color: var(--fg); }
.active-filters { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
.filter-chip {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 7px; background: var(--accent-soft);
  border: 1px solid var(--accent); border-radius: 20px;
  font-size: 11px; color: var(--accent);
}
.filter-chip-remove {
  background: none; border: none; color: var(--accent);
  cursor: pointer; padding: 0; font-size: 12px; line-height: 1;
}
.sort-select {
  margin-left: auto; padding: 4px 8px; flex-shrink: 0;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--fg-muted);
  font-size: 12px; font-family: var(--font); outline: none; cursor: pointer;
}
.sort-select:focus { border-color: var(--accent); }

/* ── Card grid ──────────────────────────────────────────────────── */
#card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 10px; padding: 14px 16px;
}
.project-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 13px;
  cursor: pointer; transition: border-color 120ms, transform 120ms;
  display: flex; flex-direction: column; gap: 7px;
}
.project-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-1px);
}
.project-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.cat-badge {
  padding: 2px 7px; border-radius: var(--radius-sm);
  font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; flex-shrink: 0; line-height: 1.6;
}
.year-tag { font-size: 11px; color: var(--fg-faint); flex-shrink: 0; margin-top: 2px; }
.card-name { font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--fg); }
.card-org { font-size: 12px; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-desc {
  font-size: 12px; color: var(--fg-muted); line-height: 1.55; flex: 1;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.card-footer {
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px; padding-top: 4px; border-top: 1px solid var(--border);
}
.card-modality { font-size: 10px; color: var(--fg-faint); display: flex; align-items: center; gap: 3px; }
.card-right { display: flex; align-items: center; gap: 6px; }
.tech-tags { display: flex; gap: 3px; flex-wrap: wrap; }
.tech-tag {
  padding: 1px 5px; background: var(--surface-2);
  border-radius: 3px; font-size: 10px; color: var(--fg-faint);
}
.card-links { display: flex; gap: 5px; }
.icon-link {
  color: var(--fg-faint); text-decoration: none;
  font-size: 13px; transition: color 100ms; line-height: 1;
  display: flex; align-items: center;
}
.icon-link:hover { color: var(--accent); }

/* ── Table view ─────────────────────────────────────────────────── */
#table-wrap { padding: 0 16px 20px; overflow-x: auto; display: none; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  text-align: left; padding: 9px 10px;
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--fg-faint);
  border-bottom: 1px solid var(--border);
  white-space: nowrap; cursor: pointer; user-select: none;
  transition: color 120ms;
}
.data-table th:hover { color: var(--fg-muted); }
.data-table th.sort-asc::after { content: " ↑"; color: var(--accent); }
.data-table th.sort-desc::after { content: " ↓"; color: var(--accent); }
.data-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table tr { cursor: pointer; transition: background 60ms; }
.data-table tr:hover td { background: var(--surface); }
.data-table tr.selected td { background: var(--accent-soft); }
.td-name { font-weight: 500; color: var(--fg); max-width: 200px; }
.td-org { color: var(--fg-muted); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.td-year { color: var(--fg-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.td-modality { font-size: 11px; color: var(--fg-faint); white-space: nowrap; }
.td-tech { font-size: 11px; color: var(--fg-faint); max-width: 160px; }
.td-links { display: flex; gap: 8px; }
.no-results {
  grid-column: 1 / -1; padding: 60px 20px;
  text-align: center; color: var(--fg-faint);
}
.no-results h3 { font-size: 15px; color: var(--fg-muted); margin-bottom: 6px; }

/* ── Detail panel ────────────────────────────────────────────────── */
.detail-panel {
  width: 320px; flex-shrink: 0;
  background: var(--surface); border-left: 1px solid var(--border);
  overflow-y: auto; position: relative;
  transform: translateX(100%); transition: transform 220ms ease;
}
.detail-panel.open { transform: none; }
.detail-close {
  position: absolute; top: 12px; right: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--fg-muted);
  padding: 3px 8px; font-size: 12px; cursor: pointer;
  font-family: var(--font); transition: all 100ms; z-index: 1;
}
.detail-close:hover { color: var(--fg); border-color: var(--border-strong); }
.detail-inner { padding: 14px 14px 24px; }
.detail-badge { margin-bottom: 10px; }
.detail-name { font-size: 16px; font-weight: 600; line-height: 1.3; margin-bottom: 3px; }
.detail-meta { font-size: 12px; color: var(--fg-muted); margin-bottom: 14px; }
.detail-section { margin-bottom: 14px; }
.detail-section-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--fg-faint); margin-bottom: 5px;
}
.detail-desc { font-size: 13px; color: var(--fg-muted); line-height: 1.65; }
.detail-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.detail-tag {
  padding: 2px 7px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 11px; color: var(--fg-muted);
}
.detail-field { font-size: 12px; color: var(--fg-muted); font-family: var(--font-mono); }
.detail-links { display: flex; flex-direction: column; gap: 5px; margin-top: 16px; }
.detail-link {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--fg-muted); text-decoration: none; font-size: 12px;
  transition: all 100ms; word-break: break-all;
}
.detail-link:hover { border-color: var(--border-strong); color: var(--fg); }
.detail-link-explorer {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; background: var(--accent-soft);
  border: 1px solid rgba(255,107,61,0.3); border-radius: var(--radius);
  color: var(--accent); text-decoration: none; font-size: 12px;
  font-weight: 500; transition: all 100ms;
}
.detail-link-explorer:hover { background: rgba(255,107,61,0.2); }
</style>
</head>
<body>

<header class="topbar">
  <a href="/" class="topbar-logo">
    <svg width="18" height="18" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="5" r="3.5" fill="#ff6b3d"/>
      <circle cx="4" cy="25" r="3.5" fill="#ff6b3d"/>
      <circle cx="28" cy="25" r="3.5" fill="#ff6b3d"/>
      <circle cx="16" cy="19" r="2.5" fill="#ff9d7a"/>
      <line x1="16" y1="5" x2="4" y2="25" stroke="#ff6b3d" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="16" y1="5" x2="28" y2="25" stroke="#ff6b3d" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="4" y1="25" x2="28" y2="25" stroke="#ff6b3d" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="16" y1="5" x2="16" y2="19" stroke="#ff9d7a" stroke-width="1" stroke-opacity="0.5"/>
      <line x1="16" y1="19" x2="4" y2="25" stroke="#ff9d7a" stroke-width="1" stroke-opacity="0.5"/>
      <line x1="16" y1="19" x2="28" y2="25" stroke="#ff9d7a" stroke-width="1" stroke-opacity="0.5"/>
    </svg>
    AI Eng. Design DB
  </a>
  <span class="topbar-sep">/</span>
  <span class="topbar-section">Browse</span>

  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="search-input" type="text" placeholder="Search name, org, description, techniques… (/)">
    <button class="search-clear" id="search-clear" onclick="clearSearch()" title="Clear">✕</button>
  </div>

  <div class="view-toggle">
    <button class="view-btn active" id="btn-cards" onclick="setView('cards')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
      </svg>
      Cards
    </button>
    <button class="view-btn" id="btn-table" onclick="setView('table')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>
      </svg>
      Table
    </button>
  </div>

  <a href="/" class="topbar-link">
    Graph Explorer
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
    </svg>
  </a>
</header>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="filter-section">
      <div class="filter-header">
        <span class="filter-label">Category</span>
        <button class="filter-clear" onclick="clearFilter('cats')">Clear</button>
      </div>
      <div class="cat-list" id="cat-list"></div>
      <button class="show-more-btn" id="cat-more-btn" onclick="toggleCatMore()" style="display:none"></button>
    </div>

    <div class="filter-section">
      <div class="filter-header"><span class="filter-label">Year range</span></div>
      <div class="year-row">
        <input class="year-input" id="year-min" type="number" placeholder="From" min="2000" max="2030" oninput="applyFilters()">
        <span class="year-sep">–</span>
        <input class="year-input" id="year-max" type="number" placeholder="To" min="2000" max="2030" oninput="applyFilters()">
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-header">
        <span class="filter-label">Output modality</span>
        <button class="filter-clear" onclick="clearFilter('mods')">Clear</button>
      </div>
      <div class="chip-row" id="mod-chips"></div>
    </div>

    <div class="filter-section">
      <div class="filter-header"><span class="filter-label">Organization</span></div>
      <input class="org-input" id="org-input" type="text" placeholder="Filter by org…" oninput="applyFilters()">
    </div>

    <div class="sidebar-footer">
      <button class="clear-all-btn" onclick="clearAll()">Clear all filters</button>
    </div>
  </aside>

  <!-- Content -->
  <div class="main">
    <div class="results-bar">
      <span class="results-count" id="results-count">Loading…</span>
      <div class="active-filters" id="active-filters"></div>
      <select class="sort-select" id="sort-select" onchange="onSortChange()">
        <option value="year-desc">Newest first</option>
        <option value="year-asc">Oldest first</option>
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="org-asc">Org A–Z</option>
      </select>
    </div>

    <div id="card-grid"></div>

    <div id="table-wrap">
      <table class="data-table" id="data-table">
        <thead><tr>
          <th data-field="name" onclick="sortByCol('name')">Name</th>
          <th data-field="org" onclick="sortByCol('org')">Organization</th>
          <th data-field="year" onclick="sortByCol('year')">Year</th>
          <th data-field="cat" onclick="sortByCol('cat')">Category</th>
          <th>Modality</th>
          <th>Techniques</th>
          <th>Links</th>
        </tr></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Detail panel -->
  <div class="detail-panel" id="detail-panel">
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <div class="detail-inner" id="detail-inner"></div>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────
const GRAPH_URL = "./graph/graph-data.json";
const CAT_COLORS = [
  ["#ff6b3d", "rgba(255,107,61,0.12)"],
  ["#7ad3a6", "rgba(122,211,166,0.1)"],
  ["#60a5fa", "rgba(96,165,250,0.1)"],
  ["#f0a85b", "rgba(240,168,91,0.1)"],
  ["#c084fc", "rgba(192,132,252,0.1)"],
  ["#fb7185", "rgba(251,113,133,0.1)"],
  ["#34d399", "rgba(52,211,153,0.1)"],
  ["#818cf8", "rgba(129,140,248,0.1)"],
  ["#fbbf24", "rgba(251,191,36,0.1)"],
  ["#22d3ee", "rgba(34,211,238,0.1)"],
  ["#a78bfa", "rgba(167,139,250,0.1)"],
  ["#f472b6", "rgba(244,114,182,0.1)"],
];
const catColorCache = new Map();
const CAT_LIMIT = 13;

// ── State ─────────────────────────────────────────────────────────
const S = {
  all: [],
  filtered: [],
  view: "cards",
  sortField: "year",
  sortDir: "desc",
  selectedId: null,
  filters: {
    q: "",
    cats: new Set(),
    yearMin: null,
    yearMax: null,
    mods: new Set(),
    org: "",
  },
  catCounts: {},
  showAllCats: false,
};

// ── Utilities ─────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function catColor(cat) {
  if (!catColorCache.has(cat)) {
    catColorCache.set(cat, CAT_COLORS[catColorCache.size % CAT_COLORS.length]);
  }
  return catColorCache.get(cat);
}
function badge(cat, size) {
  if (!cat) return "";
  const [fg, bg] = catColor(cat);
  const fs = size === "lg" ? "11px" : "10px";
  const pd = size === "lg" ? "3px 9px" : "2px 7px";
  return `<span class="cat-badge" style="color:${fg};background:${bg};font-size:${fs};padding:${pd}">${esc(cat)}</span>`;
}
function shortMod(m) {
  return (m || "").replace(/-/g, " ") || "—";
}
function truncate(s, n) {
  return s.length > n ? s.slice(0, n) + "…" : s;
}

// ── Data loading ──────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch(GRAPH_URL);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const g = await r.json();
    S.all = g.nodes
      .filter(n => n.type === "Project")
      .map(n => {
        const p = n.props || {};
        return {
          id: n.id,
          name: p.name || n.label || n.id,
          org: p.organization || "unknown",
          year: p.year || 0,
          cat: p.category || "",
          desc: p.description || "",
          url: p.url || "",
          paper: p.url_paper || "",
          techniques: Array.isArray(p.techniques) ? p.techniques : [],
          inMod: p.input_modality || "",
          outMod: p.output_modality || "",
          physics: p.physics_domain || "",
          industry: Array.isArray(p.industry_application) ? p.industry_application : [],
          tags: Array.isArray(p.tags) ? p.tags : [],
        };
      });
    // Build category counts
    S.all.forEach(p => { S.catCounts[p.cat] = (S.catCounts[p.cat] || 0) + 1; });
    renderSidebar();
    applyFilters();
  } catch (e) {
    document.getElementById("results-count").textContent = "Failed to load — " + e.message;
  }
}

// ── Sidebar ───────────────────────────────────────────────────────
function renderSidebar() {
  // Categories
  const sorted = Object.entries(S.catCounts).sort((a, b) => b[1] - a[1]);
  const visible = S.showAllCats ? sorted : sorted.slice(0, CAT_LIMIT);
  const catList = document.getElementById("cat-list");
  catList.innerHTML = visible.map(([cat, cnt]) => {
    const active = S.filters.cats.has(cat) ? "active" : "";
    const [fg] = catColor(cat);
    return `<label class="cat-item ${active}" onclick="toggleCat('${esc(cat)}')">
      <span class="cat-dot" style="background:${fg}"></span>
      <span class="cat-item-name">${esc(cat)}</span>
      <span class="cat-count">${cnt}</span>
    </label>`;
  }).join("");

  const moreBtn = document.getElementById("cat-more-btn");
  const extra = sorted.length - CAT_LIMIT;
  if (extra > 0) {
    moreBtn.style.display = "block";
    moreBtn.textContent = S.showAllCats ? "Show less ↑" : `Show ${extra} more ↓`;
  } else {
    moreBtn.style.display = "none";
  }

  // Output modality chips
  const mods = [...new Set(S.all.map(p => p.outMod).filter(Boolean))].sort();
  const chipRow = document.getElementById("mod-chips");
  chipRow.innerHTML = mods.map(m => {
    const active = S.filters.mods.has(m) ? "active" : "";
    return `<span class="chip ${active}" onclick="toggleMod('${esc(m)}')">${esc(shortMod(m))}</span>`;
  }).join("");
}

function toggleCatMore() {
  S.showAllCats = !S.showAllCats;
  renderSidebar();
}
function toggleCat(cat) {
  S.filters.cats.has(cat) ? S.filters.cats.delete(cat) : S.filters.cats.add(cat);
  renderSidebar();
  applyFilters();
}
function toggleMod(m) {
  S.filters.mods.has(m) ? S.filters.mods.delete(m) : S.filters.mods.add(m);
  renderSidebar();
  applyFilters();
}
function clearFilter(k) {
  if (k === "cats") S.filters.cats.clear();
  if (k === "mods") S.filters.mods.clear();
  renderSidebar();
  applyFilters();
}
function clearAll() {
  S.filters.cats.clear();
  S.filters.mods.clear();
  S.filters.yearMin = null;
  S.filters.yearMax = null;
  S.filters.org = "";
  S.filters.q = "";
  document.getElementById("search-input").value = "";
  document.getElementById("search-clear").classList.remove("visible");
  document.getElementById("year-min").value = "";
  document.getElementById("year-max").value = "";
  document.getElementById("org-input").value = "";
  renderSidebar();
  applyFilters();
}
function clearSearch() {
  document.getElementById("search-input").value = "";
  document.getElementById("search-clear").classList.remove("visible");
  S.filters.q = "";
  applyFilters();
}

// ── Filtering ─────────────────────────────────────────────────────
function applyFilters() {
  const q = document.getElementById("search-input").value.trim().toLowerCase();
  const yMin = parseInt(document.getElementById("year-min").value) || 0;
  const yMax = parseInt(document.getElementById("year-max").value) || 9999;
  const org = document.getElementById("org-input").value.trim().toLowerCase();
  S.filters.q = q;
  S.filters.org = org;
  document.getElementById("search-clear").classList.toggle("visible", q.length > 0);

  S.filtered = S.all.filter(p => {
    if (S.filters.cats.size && !S.filters.cats.has(p.cat)) return false;
    if (yMin && p.year && p.year < yMin) return false;
    if (yMax < 9999 && p.year && p.year > yMax) return false;
    if (S.filters.mods.size && !S.filters.mods.has(p.outMod)) return false;
    if (org && !p.org.toLowerCase().includes(org)) return false;
    if (q) {
      const hay = [p.name, p.org, p.cat, p.desc, p.physics, ...p.techniques, ...p.industry].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  S.filtered = doSort(S.filtered);
  renderResults();
  renderActiveFilters();
}

function renderActiveFilters() {
  const chips = [];
  S.filters.cats.forEach(c => chips.push(`<span class="filter-chip">${esc(c)}<button class="filter-chip-remove" onclick="toggleCat('${esc(c)}')">✕</button></span>`));
  S.filters.mods.forEach(m => chips.push(`<span class="filter-chip">${esc(shortMod(m))}<button class="filter-chip-remove" onclick="toggleMod('${esc(m)}')">✕</button></span>`));
  document.getElementById("active-filters").innerHTML = chips.join("");
}

// ── Sorting ───────────────────────────────────────────────────────
function doSort(arr) {
  const mul = S.sortDir === "asc" ? 1 : -1;
  return [...arr].sort((a, b) => {
    let va, vb;
    switch (S.sortField) {
      case "year": va = a.year || 0; vb = b.year || 0; break;
      case "name": va = a.name.toLowerCase(); vb = b.name.toLowerCase(); break;
      case "org":  va = a.org.toLowerCase();  vb = b.org.toLowerCase();  break;
      case "cat":  va = a.cat.toLowerCase();  vb = b.cat.toLowerCase();  break;
      default:     va = a.name.toLowerCase(); vb = b.name.toLowerCase();
    }
    return va < vb ? -mul : va > vb ? mul : 0;
  });
}
function onSortChange() {
  const [f, d] = document.getElementById("sort-select").value.split("-");
  S.sortField = f; S.sortDir = d;
  S.filtered = doSort(S.filtered);
  renderContent();
}
function sortByCol(field) {
  if (S.sortField === field) {
    S.sortDir = S.sortDir === "asc" ? "desc" : "asc";
  } else {
    S.sortField = field;
    S.sortDir = field === "year" ? "desc" : "asc";
  }
  document.getElementById("sort-select").value = `${S.sortField}-${S.sortDir}`;
  S.filtered = doSort(S.filtered);
  renderTable();
  updateThHeaders();
}
function updateThHeaders() {
  const fieldMap = { 0: "name", 1: "org", 2: "year", 3: "cat" };
  document.querySelectorAll(".data-table th").forEach((th, i) => {
    th.className = "";
    if (fieldMap[i] === S.sortField) th.className = "sort-" + S.sortDir;
  });
}

// ── Rendering ─────────────────────────────────────────────────────
function renderResults() {
  const n = S.filtered.length;
  const t = S.all.length;
  document.getElementById("results-count").innerHTML =
    `<strong>${n.toLocaleString()}</strong>${n < t ? " / " + t.toLocaleString() : ""} projects`;
  renderContent();
}
function renderContent() {
  if (S.view === "cards") renderCards();
  else renderTable();
}

function renderCards() {
  const grid = document.getElementById("card-grid");
  if (!S.filtered.length) {
    grid.innerHTML = `<div class="no-results"><h3>No projects found</h3><p>Try different filters or a broader search.</p></div>`;
    return;
  }
  grid.innerHTML = S.filtered.map(p => {
    const techs = p.techniques.slice(0, 4).map(t => `<span class="tech-tag">${esc(t)}</span>`).join("");
    const moreTech = p.techniques.length > 4 ? `<span class="tech-tag">+${p.techniques.length - 4}</span>` : "";
    const modStr = (p.inMod || p.outMod)
      ? `${esc(shortMod(p.inMod || "?"))} → ${esc(shortMod(p.outMod || "?"))}`
      : "";
    const paperLink = p.paper ? `<a class="icon-link" href="${esc(p.paper)}" target="_blank" title="Paper" onclick="event.stopPropagation()">📄</a>` : "";
    const codeLink  = p.url   ? `<a class="icon-link" href="${esc(p.url)}"   target="_blank" title="Project" onclick="event.stopPropagation()">🔗</a>` : "";
    const sel = S.selectedId === p.id ? "selected" : "";
    return `<div class="project-card ${sel}" data-id="${esc(p.id)}" onclick="selectProject('${esc(p.id)}')">
      <div class="card-top">${badge(p.cat)}<span class="year-tag">${p.year || ""}</span></div>
      <div class="card-name">${esc(p.name)}</div>
      <div class="card-org">${esc(p.org)}</div>
      <div class="card-desc">${esc(p.desc)}</div>
      <div class="card-footer">
        <div class="card-modality">${modStr}</div>
        <div class="card-right">
          <div class="tech-tags">${techs}${moreTech}</div>
          <div class="card-links">${paperLink}${codeLink}</div>
        </div>
      </div>
    </div>`;
  }).join("");
}

function renderTable() {
  const tbody = document.getElementById("table-body");
  if (!S.filtered.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="no-results"><h3>No projects found</h3></td></tr>`;
    return;
  }
  tbody.innerHTML = S.filtered.map(p => {
    const paperLink = p.paper ? `<a class="icon-link" href="${esc(p.paper)}" target="_blank" onclick="event.stopPropagation()" title="Paper">📄</a>` : "";
    const codeLink  = p.url   ? `<a class="icon-link" href="${esc(p.url)}"   target="_blank" onclick="event.stopPropagation()" title="Project">🔗</a>` : "";
    const techs = p.techniques.slice(0, 3).join(", ") + (p.techniques.length > 3 ? ` +${p.techniques.length - 3}` : "");
    const sel = S.selectedId === p.id ? "selected" : "";
    return `<tr class="${sel}" data-id="${esc(p.id)}" onclick="selectProject('${esc(p.id)}')">
      <td class="td-name">${esc(p.name)}</td>
      <td class="td-org" title="${esc(p.org)}">${esc(truncate(p.org, 30))}</td>
      <td class="td-year">${p.year || "—"}</td>
      <td>${badge(p.cat)}</td>
      <td class="td-modality">${esc(shortMod(p.inMod))} → ${esc(shortMod(p.outMod))}</td>
      <td class="td-tech">${esc(techs)}</td>
      <td class="td-links">${paperLink}${codeLink}</td>
    </tr>`;
  }).join("");
  updateThHeaders();
}

// ── View toggle ───────────────────────────────────────────────────
function setView(v) {
  S.view = v;
  document.getElementById("btn-cards").classList.toggle("active", v === "cards");
  document.getElementById("btn-table").classList.toggle("active", v === "table");
  document.getElementById("card-grid").style.display  = v === "cards" ? "" : "none";
  document.getElementById("table-wrap").style.display = v === "table" ? "" : "none";
  renderContent();
}

// ── Detail panel ──────────────────────────────────────────────────
function selectProject(id) {
  if (S.selectedId === id) { closeDetail(); return; }
  S.selectedId = id;
  document.querySelectorAll("[data-id]").forEach(el => {
    el.classList.toggle("selected", el.dataset.id === id);
  });
  const p = S.all.find(x => x.id === id);
  if (!p) return;

  const techTags     = p.techniques.map(t => `<span class="detail-tag">${esc(t)}</span>`).join("");
  const industryTags = p.industry.map(i  => `<span class="detail-tag">${esc(i)}</span>`).join("");
  const tagTags      = p.tags.map(t      => `<span class="detail-tag">${esc(t)}</span>`).join("");

  document.getElementById("detail-inner").innerHTML = `
    <div class="detail-badge" style="margin-top:8px">${badge(p.cat, "lg")}</div>
    <div class="detail-name">${esc(p.name)}</div>
    <div class="detail-meta">${esc(p.org)} · ${p.year || "—"}</div>

    ${p.desc ? `<div class="detail-section">
      <div class="detail-section-label">Description</div>
      <div class="detail-desc">${esc(p.desc)}</div>
    </div>` : ""}

    ${techTags ? `<div class="detail-section">
      <div class="detail-section-label">Techniques</div>
      <div class="detail-tags">${techTags}</div>
    </div>` : ""}

    ${(p.inMod || p.outMod || p.physics) ? `<div class="detail-section">
      <div class="detail-section-label">Modality / Physics</div>
      <div class="detail-tags">
        ${p.inMod   ? `<span class="detail-tag">in: ${esc(p.inMod)}</span>` : ""}
        ${p.outMod  ? `<span class="detail-tag">out: ${esc(p.outMod)}</span>` : ""}
        ${p.physics ? `<span class="detail-tag">physics: ${esc(p.physics)}</span>` : ""}
      </div>
    </div>` : ""}

    ${industryTags ? `<div class="detail-section">
      <div class="detail-section-label">Industry</div>
      <div class="detail-tags">${industryTags}</div>
    </div>` : ""}

    ${tagTags ? `<div class="detail-section">
      <div class="detail-section-label">Tags</div>
      <div class="detail-tags">${tagTags}</div>
    </div>` : ""}

    <div class="detail-links">
      ${p.paper ? `<a class="detail-link" href="${esc(p.paper)}" target="_blank">📄 Paper / arXiv</a>` : ""}
      ${p.url   ? `<a class="detail-link" href="${esc(p.url)}"   target="_blank">🔗 Project / Code</a>` : ""}
      <a class="detail-link-explorer" href="/?q=${encodeURIComponent(p.name)}" target="_blank">⬡ Open in Graph Explorer</a>
    </div>`;

  document.getElementById("detail-panel").classList.add("open");
}

function closeDetail() {
  S.selectedId = null;
  document.getElementById("detail-panel").classList.remove("open");
  document.querySelectorAll("[data-id].selected").forEach(el => el.classList.remove("selected"));
}

// ── Keyboard ──────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  const inp = document.getElementById("search-input");
  if (e.key === "/" && document.activeElement !== inp) {
    e.preventDefault();
    inp.focus();
    inp.select();
  }
  if (e.key === "Escape") {
    if (document.activeElement === inp) inp.blur();
    else closeDetail();
  }
});
document.getElementById("search-input").addEventListener("input", applyFilters);

init();
</script>
</body>
</html>
