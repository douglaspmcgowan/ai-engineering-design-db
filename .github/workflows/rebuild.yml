name: Rebuild graph

on:
  schedule:
    - cron: "0 3 */2 * *"   # 3 AM UTC every other day
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install openai anthropic numpy umap-learn scikit-learn
          fi

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run pipeline

      - name: Generate embedding report
        run: |
          if [ -f scripts/embedding-report.py ]; then
            python scripts/embedding-report.py
          fi

      - name: Archive and clear inbox
        run: |
          if [ -s raw/inbox.jsonl ]; then
            cp raw/inbox.jsonl "reports/inbox-$(date -u +%Y-%m-%d).jsonl"
          fi
          printf "" > raw/inbox.jsonl

      - name: Commit results
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add graph/ reports/ embeddings.jsonl consolidated.jsonl raw/inbox.jsonl || true
          git diff --staged --quiet || git commit -m "chore: rebuild graph $(date -u +%Y-%m-%d) [skip ci]"
          git push
