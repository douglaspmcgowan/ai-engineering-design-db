name: Rebuild graph

on:
  schedule:
    - cron: "0 3 * * 0"    # 3 AM UTC every Sunday
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Early exit if inbox is empty ──────────────────────────────────────
      - name: Check inbox
        id: check
        run: |
          if [ ! -s raw/inbox.jsonl ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Inbox is empty — skipping pipeline run."
          else
            count=$(wc -l < raw/inbox.jsonl | tr -d ' ')
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Inbox has ${count} line(s) — running pipeline."
          fi

      # ── Everything below is skipped when inbox is empty ──────────────────
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == 'false'
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: "20"

      - name: Install npm dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Install Python dependencies
        if: steps.check.outputs.skip == 'false'
        run: pip install -r requirements.txt

      # ── Step 1: LLM structuring — parse messy inbox into clean JSONL ─────
      - name: Structure inbox with GPT-4o
        if: steps.check.outputs.skip == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/structure-inbox.py

      # ── Step 2: Full pipeline — consolidate → embed → UMAP → graph ───────
      - name: Run pipeline
        if: steps.check.outputs.skip == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run pipeline

      - name: Generate embedding report
        if: steps.check.outputs.skip == 'false'
        run: |
          if [ -f scripts/embedding-report.py ]; then
            python scripts/embedding-report.py
          fi

      # ── Archive inbox and clear it for next run ───────────────────────────
      - name: Archive and clear inbox
        if: steps.check.outputs.skip == 'false'
        run: |
          if [ -s raw/inbox.jsonl ]; then
            cp raw/inbox.jsonl "reports/inbox-$(date -u +%Y-%m-%d).jsonl"
          fi
          printf "" > raw/inbox.jsonl

      # ── Commit results back to main ───────────────────────────────────────
      - name: Commit results
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add graph/ reports/ embeddings.jsonl consolidated.jsonl raw/inbox.jsonl || true
          git diff --staged --quiet || git commit -m "chore: rebuild graph $(date -u +%Y-%m-%d) [skip ci]"
          git push
