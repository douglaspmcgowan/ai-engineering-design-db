name: Discovery pipeline

# Runs every two weeks on Sunday at 14:00 UTC. First scheduled run lands ~2026-05-15.
# Manual trigger via the "Run workflow" button.
on:
  schedule:
    - cron: "0 14 1,15 * *"   # 1st and 15th of every month at 14:00 UTC (~bi-weekly)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push the inbox update
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Run discovery pipeline
        run: python -m pipeline.run

      - name: Commit any new inbox entries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw/inbox-pipeline.jsonl pipeline/state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "pipeline: $(date -u +'%Y-%m-%d') discovery run"
            git push
          else
            echo "No new entries this run."
          fi
